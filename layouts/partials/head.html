<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | Pressgang Mutiny{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta name="theme-color" content="#ede7dd">
<meta name="robots" content="index, follow, max-image-preview:large">
{{ if .IsHome }}
<link rel="preload" as="image" type="image/webp" media="(min-width: 761px)" imagesrcset="{{ "img/oct24/hero-wide-1280.webp" | relURL }} 1280w, {{ "img/oct24/hero-wide-1920.webp" | relURL }} 1920w" imagesizes="100vw">
<link rel="preload" as="image" type="image/webp" media="(max-width: 760px)" imagesrcset="{{ "img/oct24/hero-tall-800.webp" | relURL }} 800w, {{ "img/oct24/hero-tall-1200.webp" | relURL }} 1200w" imagesizes="100vw">
{{ end }}

<!-- Favicon: crown-and-anchor mark -->
<link rel="icon" href="{{ "img/favicon-32.png" | relURL }}" sizes="32x32" type="image/png">
<link rel="icon" href="{{ "img/favicon.png" | relURL }}" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="{{ "img/favicon.png" | relURL }}">

<!-- RSS -->
<link rel="alternate" type="application/rss+xml" title="Pressgang Mutiny" href="{{ "index.xml" | absURL }}">
{{ with .OutputFormats.Get "RSS" }}
<link rel="alternate" type="{{ .MediaType }}" title="{{ $.Site.Title }}" href="{{ .RelPermalink }}">
{{ end }}

<!-- Open Graph -->
<meta property="og:type" content="{{ if .IsHome }}website{{ else if eq .Section "releases" }}music.album{{ else }}article{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | Pressgang Mutiny{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:site_name" content="Pressgang Mutiny">
<meta property="og:locale" content="en_CA">
{{ if .Params.cover -}}
<meta property="og:image" content="{{ .Params.cover | absURL }}">
{{ else -}}
<meta property="og:image" content="{{ "img/og-image.jpg" | absURL }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Pressgang Mutiny, Toronto shanty band">
{{ end -}}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@pressgangmutiny">
<meta name="twitter:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | Pressgang Mutiny{{ end }}">
<meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
{{ if .Params.cover -}}
<meta name="twitter:image" content="{{ .Params.cover | absURL }}">
{{ else -}}
<meta name="twitter:image" content="{{ "img/og-image.jpg" | absURL }}">
{{ end -}}

<!-- Fonts: preconnect + stylesheet in the head instead of a render-blocking @import inside main.css -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap">

<!-- Styles -->
<link rel="stylesheet" href="{{ "css/main.css" | relURL }}">

<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '832862114112264');
fbq('track', 'PageView');
</script>
<noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=832862114112264&ev=PageView&noscript=1"
/></noscript>
<!-- End Meta Pixel -->

<!-- MusicGroup schema (all pages) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicGroup",
  "name": "Pressgang Mutiny",
  "description": "{{ site.Params.description }}",
  "url": "{{ site.BaseURL }}",
  "image": "{{ "img/og-image.jpg" | absURL }}",
  "email": "{{ site.Params.booking_email }}",
  "genre": ["sea shanties", "folk", "world music", "traditional"],
  "foundingDate": "2013",
  "foundingLocation": {
    "@type": "Place",
    "name": "Toronto, Ontario, Canada"
  },
  "member": [
    { "@type": "Person", "name": "Richard Kott" },
    { "@type": "Person", "name": "Josh Ludy" },
    { "@type": "Person", "name": "James McKie" },
    { "@type": "Person", "name": "Stefan Read" }
  ],
  "album": {
    "@type": "MusicAlbum",
    "name": "Departure",
    "datePublished": "2026",
    "url": "{{ "releases/departure/" | absURL }}"
  },
  "sameAs": [
    "{{ site.Params.bandcamp }}",
    "{{ site.Params.spotify }}",
    "{{ site.Params.youtube }}",
    "{{ site.Params.facebook }}",
    "{{ site.Params.instagram }}",
    "{{ site.Params.tiktok }}",
    "{{ site.Params.twitter }}"
  ]
}
</script>

{{ if eq .Section "releases" }}{{ if .IsPage }}
<!-- MusicAlbum / MusicRecording schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ if ge .Params.weight 1 }}MusicAlbum{{ else }}MusicRecording{{ end }}",
  "name": "{{ .Title }}",
  "description": "{{ .Params.description }}",
  "datePublished": "{{ .Params.year }}",
  {{ with .Params.cover }}"image": "{{ . | absURL }}",{{ end }}
  "byArtist": {
    "@type": "MusicGroup",
    "name": "Pressgang Mutiny"
  }{{ with .Params.label }},
  "recordLabel": {
    "@type": "Organization",
    "name": "{{ . }}"
  }{{ end }}
}
</script>
{{ end }}{{ end }}

{{ if eq .Layout "the-shanty-show" }}
<!-- Podcast schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "PodcastSeries",
  "name": "The Shanty Show",
  "description": "The world's foremost podcast about shanties — featuring conversations with the best shanty singers, scholars, and historians from around the world.",
  "url": "{{ .Permalink }}",
  "author": {
    "@type": "MusicGroup",
    "name": "Pressgang Mutiny"
  },
  "webFeed": "https://www.youtube.com/playlist?list=PLTVrVI4udC7XOiVyKRHRwNh1s1bP8XI1S"
}
</script>
{{ end }}
